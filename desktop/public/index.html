<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SewaLink Desktop</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .app {
        display: grid;
        gap: 24px;
        padding: 40px;
      }
      .card {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 24px;
        padding: 28px;
      }
      a {
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="card">
        <h1>SewaLink Desktop</h1>
        <p>Desktop app shell for the service marketplace. Build the Electron UI here and connect it to the web API.</p>
      </div>
      <div class="card">
        <h2>Next steps</h2>
        <ul>
          <li>Implement provider booking and chat workflows.</li>
          <li>Integrate the web API using fetch requests.</li>
          <li>Add native desktop notifications and offline caching.</li>
        </ul>
      </div>
    </div>
  </body>
</html>
